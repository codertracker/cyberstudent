<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberCV · Contatti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:opsz,wght@14..32,400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-wrapper contact-page">

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
      <div class="nav-brand">
        <span class="brand-icon"></span>
        <span class="brand-name">cyber<span class="highlight">.cv</span></span>
      </div>
      <ul class="nav-links">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="contact.html" class="active">CONTACT</a></li>
      </ul>
      <div class="nav-status">
        <span class="status-dot"></span>
        <span class="status-text">ONLINE</span>
      </div>
    </nav>

    <!-- ========== CONTACT SECTION ========== -->
    <section id="contact" class="contact-section">
      <div class="section-header">
        <h2>//_ contatta</h2>
        <span class="section-line"></span>
      </div>
      <div class="contact-wrapper">
        <form id="contact-form" class="contact-form">
          <div class="form-group">
            <label for="name">nome</label>
            <input type="text" id="name" placeholder="es. Marco" required />
          </div>
          <div class="form-group">
            <label for="email">email</label>
            <input type="email" id="email" placeholder="marco@proton.me" required />
          </div>
          <div class="form-group">
            <label for="message">messaggio</label>
            <textarea id="message" rows="4" placeholder="Scrivi il tuo messaggio..." required></textarea>
          </div>
          <button type="submit" class="btn-submit">
            <span class="btn-text">invia</span>
            <span class="btn-icon">➜</span>
          </button>
        </form>
        <div class="contact-info">
          <div class="info-item">
            <span class="info-label">email</span>
            <span class="info-value">marco.sec@proton.me</span>
          </div>
          <div class="info-item">
            <span class="info-label">matrix</span>
            <span class="info-value">@marco:matrix.org</span>
          </div>
          <div class="info-item">
            <span class="info-label">github</span>
            <span class="info-value">/marco-sec</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
      <p>© 2026 · cyber.cv — built with [1,0...] and <span class="term">[terminal]</span></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
